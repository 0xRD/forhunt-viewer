[workspace]
resolver = "3"
members = ["crates/fhv-engine", "crates/fhv-app", "tools/csv-gen", "tools/fhv-bench"]
default-members = ["crates/fhv-app"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xRD/forhunt-viewer"
homepage = "https://github.com/0xRD/forhunt-viewer"
authors = ["0xRD"]

[workspace.dependencies]
fhv-engine = { path = "crates/fhv-engine", version = "0.5.1" }
anyhow = "1"
thiserror = "2"
# Pure Rust: we hash ~192 KiB per file; no C toolchain needed for cross builds.
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
memchr = "2"
memmap2 = "0.9"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
roaring = "0.11"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
proptest = "1"
# EVTX / $MFT / $J parsing and the CSV layout of `forhunt parse -F csv` (D-033).
forhunt-core = { git = "https://github.com/0xRD/forensic-hunter", tag = "v0.3.0", version = "0.3.0" }
forhunt-output = { git = "https://github.com/0xRD/forensic-hunter", tag = "v0.3.0", version = "0.3.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort: a panic in a worker (bug on malformed input) is caught,
# reported in the UI, and does not take the analyst's other tabs down.
panic = "unwind"
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# Fast builds for tests that need optimized engine code.
[profile.test]
opt-level = 1
