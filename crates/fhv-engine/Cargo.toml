[package]
name = "fhv-engine"
description = "Headless engine of forhunt-viewer: CSV indexing, column indexes, filters, sort, export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
memchr.workspace = true
memmap2.workspace = true
rayon.workspace = true
regex.workspace = true
regex-syntax.workspace = true
roaring.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
# Zones of date columns written without an offset (D-051).
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }

[dev-dependencies]
csv-gen = { path = "../../tools/csv-gen" }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
