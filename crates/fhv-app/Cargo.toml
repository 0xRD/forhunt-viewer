[package]
name = "fhv-app"
description = "forhunt-viewer: a fast timeline / CSV viewer for forensic analysts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "forhunt-viewer"
path = "src/main.rs"

[dependencies]
fhv-engine.workspace = true
anyhow.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
blake3.workspace = true
forhunt-core.workspace = true
forhunt-output.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "clipboard", "accesskit", "system_fonts"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
# Installed fonts for the grid (D-057): both already in the tree through
# eframe's system font fallback.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# HTML copies (#25): already in the tree through eframe's clipboard.
arboard = { version = "3.7", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile.workspace = true

[lints]
workspace = true

# Finder "Open With" delivers files through an Apple Event, not argv.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString", "NSObject"] }

[build-dependencies]
embed-resource = "3"
