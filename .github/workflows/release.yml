name: Release

# Builds and publishes the release packages. Runs only on a version tag or by
# hand (Actions minutes are limited: D-017). A manual run without a tag is a
# dry run: everything is built and packaged, nothing is published.
#   Linux x86_64: .tar.gz + .AppImage
#   macOS arm64 (Apple Silicon only, D-018): .dmg with forhunt-viewer.app
#   Windows x86_64: .msi (Open with entries) + portable .zip
# Each file gets a .sha256; SHA256SUMS lists them all.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from the selected branch head, e.g. v0.1.0 (created if missing). Empty: dry run"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}
  TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}

jobs:
  build:
    name: package ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$DRY_RUN" = true ]; then
            echo "VER=${ver}" >> "$GITHUB_ENV"
          else
            case "${TAG#v}" in
              "$ver"|"$ver"-*) echo "VER=${TAG#v}" >> "$GITHUB_ENV" ;;
              *) echo "::error::tag $TAG does not match Cargo.toml version $ver"; exit 1 ;;
            esac
          fi
          echo "MSI_VER=${ver}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
          cargo build --release --locked -p fhv-app
          target/release/forhunt-viewer --version
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # Unpinned build tool (D-025): record exactly what was used.
          sha256sum appimagetool
          scripts/package-linux.sh "$VER" "$PWD/appimagetool"

      - name: Build + package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked -p fhv-app --target aarch64-apple-darwin
          target/aarch64-apple-darwin/release/forhunt-viewer --version
          scripts/package-macos.sh "$VER"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Static CRT: no Visual C++ redistributable needed.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p fhv-app
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "forhunt-viewer-$env:VER-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "stage\$name", dist | Out-Null
          Copy-Item target\release\forhunt-viewer.exe, LICENSE-MIT, LICENSE-APACHE, README.md, THIRD-PARTY.md, packaging\icons\icon.ico "stage\$name\"
          Copy-Item crates\fhv-app\assets\fonts\OFL-*.txt "stage\$name\"
          Compress-Archive -Path "stage\$name" -DestinationPath "dist\$name.zip"
          dotnet tool install --global wix --version 5.0.2
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          $bin = (Resolve-Path "stage\$name").Path
          & $wix build -arch x64 -d "Version=$env:MSI_VER" -d "BinDir=$bin" packaging\windows\forhunt-viewer.wxs -o "dist\$name.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          Get-ChildItem dist -File | Where-Object { $_.Name -notlike "*.sha256" -and $_.Name -notlike "*.wixpdb" } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -NoNewline -Path "$($_.FullName).sha256" -Value "$h  $($_.Name)`n"
          }
          Remove-Item dist\*.wixpdb -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          cat *.sha256 | sed 's/\r$//' > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "forhunt-viewer $TAG" $pre --notes "Unsigned builds (macOS: right-click > Open; Windows: More info > Run anyway). See README for install and Open With setup. SHA-256 of every file in SHA256SUMS."
