# cargo-deny policy: licences, advisories, bans and sources.
# Run: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `encoding` (legacy code pages for ANSI strings in EVTX) is unmaintained,
    # no known vulnerability; via forhunt-core -> evtx (same entry as forhunt).
    { id = "RUSTSEC-2021-0153", reason = "transitive via forhunt-core/evtx; unmaintained, no vulnerability" },
    # zbus_names / zvariant / zvariant_derive were folded back into the zbus
    # crate (announcement: z-galaxy/zbus#2043); "unmaintained" as standalone
    # crates, no vulnerability. Pulled in by accesskit (screen readers on
    # Linux) via eframe. See DECISIONS.md D-007.
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus; no vulnerability" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus; no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus; no vulnerability" },
]

[licenses]
version = 2
# Permissive licences only (brief, principle 7). OFL-1.1 is accepted for fonts
# only; see DECISIONS.md for the font choice.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = []

[[licenses.clarify]]
crate = "csv-gen"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# forhunt-core / forhunt-output, pinned to a release tag (D-033).
allow-git = ["https://github.com/0xRD/forensic-hunter"]
